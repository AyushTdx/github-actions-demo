name: Package UiPath Project

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - "UiPathProject/**"
      - ".github/workflows/03-package.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "20"
  UIPATH_CLI_VERSION: "1.0.0"
  PROJECT_PATH: "./UiPathProject"
  OUTPUT_PATH: "./output"

jobs:
  package:
    name: Analyze and Package UiPath Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          npm install -g "@uipath/cli@${UIPATH_CLI_VERSION}"
          echo "✓ UiPath CLI installed"
          uip --version

      - name: Verify UiPath project
        shell: bash
        run: |
          if [ ! -f "${PROJECT_PATH}/project.json" ]; then
            echo "❌ project.json not found"
            exit 1
          fi
          echo "✓ project.json verified"
          cat "${PROJECT_PATH}/project.json" | grep -E '"name"|"version"'

      - name: Restore UiPath dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Restoring dependencies..."
          uip rpa restore "${PROJECT_PATH}"
          echo "✓ Dependencies restored"

      - name: Analyze UiPath project
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Running workflow analyzer..."
          uip rpa analyze "${PROJECT_PATH}"
          echo "✓ Analysis complete"

      - name: Generate package version
        id: version
        shell: bash
        run: |
          # Extract base version from project.json
          BASE_VERSION=$(grep -o '"version": "[^"]*' "${PROJECT_PATH}/project.json" | head -1 | cut -d'"' -f4)
          
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0.0"
          fi
          
          # Generate semantic version: BASE_VERSION-run.BUILD_NUMBER
          PACKAGE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${PACKAGE_VERSION}"

      - name: Package UiPath project
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Creating package output directory..."
          mkdir -p "${OUTPUT_PATH}"
          
          echo "Packaging UiPath project (v${{ steps.version.outputs.version }})..."
          uip rpa pack "${PROJECT_PATH}" \
            --output "${OUTPUT_PATH}" \
            --version "${{ steps.version.outputs.version }}"
          
          echo "✓ Project packaged successfully"

      - name: Verify generated package
        shell: bash
        id: package
        run: |
          PACKAGE=$(find "${OUTPUT_PATH}" -name "*.nupkg" -type f)
          
          if [ -z "$PACKAGE" ]; then
            echo "❌ No .nupkg package was generated"
            exit 1
          fi
          
          PACKAGE_NAME=$(basename "$PACKAGE")
          PACKAGE_SIZE=$(du -h "$PACKAGE" | cut -f1)
          
          echo "package-path=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "package-name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          
          echo "✓ Package verified: ${PACKAGE_NAME} (${PACKAGE_SIZE})"
          ls -lh "${PACKAGE}"

      - name: Generate package manifest
        shell: bash
        run: |
          cat > "${OUTPUT_PATH}/manifest.json" << 'EOF'
          {
            "packageName": "${{ steps.package.outputs.package-name }}",
            "version": "${{ steps.version.outputs.version }}",
            "buildNumber": "${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "commitRef": "${{ github.ref }}",
            "buildTimestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "builtBy": "${{ github.actor }}"
          }
          EOF
          
          echo "✓ Manifest generated"
          cat "${OUTPUT_PATH}/manifest.json"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: uipath-package-${{ steps.version.outputs.version }}
          path: |
            ${{ env.OUTPUT_PATH }}/*.nupkg
            ${{ env.OUTPUT_PATH }}/manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Generate build summary
        shell: bash
        run: |
          echo "## 📦 Package Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package Name | ${{ steps.package.outputs.package-name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref }} |" >> $GITHUB_STEP_SUMMARY

    outputs:
      package-path: ${{ steps.package.outputs.package-path }}
      package-name: ${{ steps.package.outputs.package-name }}
      package-version: ${{ steps.version.outputs.version }}
