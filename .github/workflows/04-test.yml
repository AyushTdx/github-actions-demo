name: Execute Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to execute"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - smoke
  push:
    branches:
      - main
      - develop
    paths:
      - "UiPathProject/**"
      - "tests/**"
      - ".github/workflows/04-test.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "20"
  UIPATH_CLI_VERSION: "1.0.0"
  PROJECT_PATH: "./UiPathProject"
  TESTS_PATH: "./tests"

jobs:
  check-tests-exist:
    name: Check Test Configuration
    runs-on: ubuntu-latest

    outputs:
      tests-exist: ${{ steps.check.outputs.tests-exist }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if test configuration exists
        id: check
        shell: bash
        run: |
          if [ -f "${TESTS_PATH}/run-tests.sh" ] || [ -f "${TESTS_PATH}/test-config.json" ]; then
            echo "tests-exist=true" >> "$GITHUB_OUTPUT"
            echo "✓ Test configuration found"
          else
            echo "tests-exist=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No test configuration found - skipping test execution"
          fi

  execute-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: check-tests-exist
    if: needs.check-tests-exist.outputs.tests-exist == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          npm install -g "@uipath/cli@${UIPATH_CLI_VERSION}"
          uip --version

      - name: Restore project dependencies
        shell: bash
        run: |
          set -euo pipefail
          uip rpa restore "${PROJECT_PATH}"
          echo "✓ Dependencies restored"

      - name: Determine test suite
        id: test-config
        shell: bash
        run: |
          TEST_SUITE="${{ github.event.inputs.test_suite }}"
          if [ -z "$TEST_SUITE" ] || [ "$TEST_SUITE" == "all" ]; then
            TEST_SUITE="all"
          fi
          
          echo "test-suite=${TEST_SUITE}" >> "$GITHUB_OUTPUT"
          echo "Executing test suite: ${TEST_SUITE}"

      - name: Run tests - All
        if: steps.test-config.outputs.test-suite == 'all'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          
          echo "Running all tests..."
          
          if [ -f "${TESTS_PATH}/run-tests.sh" ]; then
            chmod +x "${TESTS_PATH}/run-tests.sh"
            "${TESTS_PATH}/run-tests.sh" --all
          else
            echo "ℹ️  Test runner not found, check test configuration"
            exit 0
          fi

      - name: Run tests - Unit
        if: steps.test-config.outputs.test-suite == 'unit'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          
          echo "Running unit tests..."
          
          if [ -f "${TESTS_PATH}/run-tests.sh" ]; then
            chmod +x "${TESTS_PATH}/run-tests.sh"
            "${TESTS_PATH}/run-tests.sh" --unit
          fi

      - name: Run tests - Integration
        if: steps.test-config.outputs.test-suite == 'integration'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          
          echo "Running integration tests..."
          
          if [ -f "${TESTS_PATH}/run-tests.sh" ]; then
            chmod +x "${TESTS_PATH}/run-tests.sh"
            "${TESTS_PATH}/run-tests.sh" --integration
          fi

      - name: Run tests - Smoke
        if: steps.test-config.outputs.test-suite == 'smoke'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          
          echo "Running smoke tests..."
          
          if [ -f "${TESTS_PATH}/run-tests.sh" ]; then
            chmod +x "${TESTS_PATH}/run-tests.sh"
            "${TESTS_PATH}/run-tests.sh" --smoke
          fi

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.TESTS_PATH }}/results/**/*
            test-*.xml
          retention-days: 30

      - name: Comment test results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ✅ Tests Executed\n\nTest suite: ${{ steps.test-config.outputs.test-suite }}\n\nSee artifacts for detailed results.'
            });

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [check-tests-exist, execute-tests]
    if: always()

    steps:
      - name: Generate test summary
        shell: bash
        run: |
          echo "## 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.check-tests-exist.outputs.tests-exist }}" == "true" ]; then
            echo "- **Status**: ✅ Tests executed" >> $GITHUB_STEP_SUMMARY
            echo "- **Suite**: ${{ github.event.inputs.test_suite || 'default' }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ℹ️  No tests configured" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed test results." >> $GITHUB_STEP_SUMMARY
