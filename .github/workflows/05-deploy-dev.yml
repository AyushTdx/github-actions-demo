name: Deploy to Development

on:
  workflow_run:
    workflows:
      - "Package UiPath Project"
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:
    inputs:
      package-version:
        description: "Package version to deploy (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"
  UIPATH_CLI_VERSION: "1.0.0"
  ENVIRONMENT: "development"
  DEPLOYMENT_FOLDER: "DefaultFolder"

jobs:
  deploy:
    name: Deploy to Development Orchestrator
    runs-on: ubuntu-latest

    environment:
      name: development
      url: ${{ vars.ORCHESTRATOR_URL }}/ordesk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          npm install -g "@uipath/cli@${UIPATH_CLI_VERSION}"
          uip --version

      - name: Download package artifact
        uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: uipath-package-*
          path: ./package-download

      - name: Validate deployment credentials
        shell: bash
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_DEV_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_DEV_CLIENT_SECRET }}
          UIPATH_TENANT: ${{ vars.UIPATH_DEV_TENANT }}
          ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
        run: |
          if [ -z "$UIPATH_CLIENT_ID" ] || [ -z "$UIPATH_CLIENT_SECRET" ] || [ -z "$UIPATH_TENANT" ]; then
            echo "❌ Missing required secrets or variables"
            echo "Required: UIPATH_DEV_CLIENT_ID, UIPATH_DEV_CLIENT_SECRET, UIPATH_DEV_TENANT"
            exit 1
          fi
          
          if [ -z "$ORCHESTRATOR_URL" ]; then
            echo "❌ Missing ORCHESTRATOR_URL variable"
            exit 1
          fi
          
          echo "✓ All required secrets and variables present"

      - name: Authenticate with UiPath Orchestrator
        shell: bash
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_DEV_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_DEV_CLIENT_SECRET }}
          UIPATH_TENANT: ${{ vars.UIPATH_DEV_TENANT }}
          ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
        run: |
          set -euo pipefail
          
          echo "Authenticating with UiPath Orchestrator..."
          uip login \
            --client-id "${UIPATH_CLIENT_ID}" \
            --client-secret "${UIPATH_CLIENT_SECRET}" \
            --tenant "${UIPATH_TENANT}" \
            --orchestrator-url "${ORCHESTRATOR_URL}"
          
          echo "✓ Authentication successful"

      - name: Locate package for deployment
        id: locate-package
        shell: bash
        run: |
          if [ -d "./package-download" ]; then
            PACKAGE=$(find ./package-download -name "*.nupkg" -type f | head -1)
          else
            PACKAGE=$(find ./output -name "*.nupkg" -type f | head -1)
          fi
          
          if [ -z "$PACKAGE" ]; then
            echo "❌ No package found for deployment"
            exit 1
          fi
          
          echo "package-path=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "✓ Package located: $(basename $PACKAGE)"

      - name: Upload package to Development feed
        shell: bash
        env:
          UIPATH_TENANT: ${{ vars.UIPATH_DEV_TENANT }}
          UIPATH_FEED_ID: ${{ vars.UIPATH_DEV_FEED_ID }}
        run: |
          set -euo pipefail
          
          echo "Uploading package to ${ENVIRONMENT} feed..."
          
          if [ -n "$UIPATH_FEED_ID" ]; then
            uip or packages upload "${{ steps.locate-package.outputs.package-path }}" \
              --tenant "${UIPATH_TENANT}" \
              --feed-id "${UIPATH_FEED_ID}"
          else
            uip or packages upload "${{ steps.locate-package.outputs.package-path }}" \
              --tenant "${UIPATH_TENANT}"
          fi
          
          echo "✓ Package uploaded successfully"

      - name: Verify deployment in Development
        shell: bash
        env:
          UIPATH_TENANT: ${{ vars.UIPATH_DEV_TENANT }}
          DEPLOYMENT_FOLDER: ${{ env.DEPLOYMENT_FOLDER }}
        run: |
          echo "Verifying deployment in ${ENVIRONMENT}..."
          
          # List packages in the tenant
          uip or packages list \
            --tenant "${UIPATH_TENANT}" \
            --folder "${DEPLOYMENT_FOLDER}" || true
          
          echo "✓ Deployment verification complete"

      - name: Create deployment record
        shell: bash
        run: |
          cat > deployment-record.json << 'EOF'
          {
            "environment": "${{ env.ENVIRONMENT }}",
            "package": "${{ steps.locate-package.outputs.package-path }}",
            "deployedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "deployedBy": "${{ github.actor }}",
            "commitSha": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}"
          }
          EOF
          
          cat deployment-record.json

      - name: Upload deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ env.ENVIRONMENT }}
          path: deployment-record.json
          retention-days: 90

      - name: Generate deployment summary
        shell: bash
        run: |
          echo "## 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | $(basename ${{ steps.locate-package.outputs.package-path }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Orchestrator URL | ${{ vars.ORCHESTRATOR_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment completion
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = "${{ job.status }}";
            const emoji = status === "success" ? "✅" : "❌";
            
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: "${{ env.ENVIRONMENT }}",
              description: `UiPath package deployment to ${status}`,
              auto_merge: false,
              required_contexts: []
            });
